<div id="screenError" class="alert alert-danger mt-3" style="display: none;"></div>
<div class="mt-3 mb-4">
    <button type="submit" id="runButton" class="btn btn-primary">
        {% if request.session.language == 'en' %}Run Simulation{% else %}Executar Simulação{% endif %}
    </button>
    <button type="button" id="resetButton" class="btn btn-secondary">
        {% if request.session.language == 'en' %}Reset{% else %}Reiniciar{% endif %}
    </button>
    <button type="button" id="saveProjectButton" class="btn btn-success" disabled>
        {% if request.session.language == 'en' %}Save Project{% else %}Salvar Projeto{% endif %}
    </button>
</div>
